[tool.poetry]
name = "vjepa-pipeline"
version = "0.1.0"
description = "Dev list, durations and clip master generation for Nexar baseline"
authors = ["Ander Garcia Hoyberg"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = "^2.2"
numpy = "^2.0"
scikit-learn = "^1.7.2"
torch = "^2.8.0"
torchvision = "^0.23.0"
pillow = "^11.3.0"
transformers = "^4.56.2"
timm = "^1.0.20"
einops = "^0.8.1"
decord = "^0.6.0"
yt-dlp = "^2025.9.26"
opencv-python = "^4.12.0.88"
tqdm = "^4.67.1"
youtube-dl = "^2021.12.17"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29"
tqdm = "^4.66"


[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
